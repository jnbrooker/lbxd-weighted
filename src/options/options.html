<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Letterboxd Weighted Stats</title>
  <style>
    body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 16px; min-width: 340px; color: #222; background: #fff; }
    label { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 12px; margin: 10px 0; }
    label small { display: block; color: #777; }
    input[type=number] { width: 90px; }
    .row { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
    #status { color: #090; }
  </style>
</head>
<body>
  <h3>Letterboxd Weighted Stats</h3>
  <label>Sample size<small>Raters sampled per film across all star buckets</small><input id="sampleSize" type="number" min="20" max="1000" step="50"></label>
  <label>Flag threshold (z)<small>Std. deviations from what their taste predicts</small><input id="zThreshold" type="number" min="1" max="4" step="0.25"></label>
  <label>Popular review pages<small>12 reviews per page, checked for flags</small><input id="reviewPages" type="number" min="0" max="5" step="1"></label>
  <label>Profile cache (days)<small>How long a rater's histogram is reused</small><input id="profileTtlDays" type="number" min="1" max="90" step="1"></label>
  <label>Friend predictions<small>Predict ratings for people you follow</small><input id="friends" type="checkbox"></label>
  <label>Your username<small>Leave blank to use whoever is signed in</small><input id="username" type="text" placeholder="auto" style="width:90px"></label>
  <label>Max friends<small>People you follow to list (mutuals first)</small><input id="maxFriends" type="number" min="5" max="2000" step="25"></label>
  <label>Friends per batch<small>Predicted at a time; more on demand</small><input id="friendBatch" type="number" min="5" max="200" step="5"></label>
  <label>Taste checks<small>Unusual raters given a full taste profile</small><input id="tasteChecks" type="number" min="0" max="60" step="5"></label>
  <label>Run automatically<small>Analyse as soon as a film page opens</small><input id="autoRun" type="checkbox"></label>
  <div class="row">
    <button id="save">Save</button>
    <button id="clear">Clear cache</button>
    <span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
